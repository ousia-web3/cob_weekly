                          id="colorUv"
                          x1="0"
                          y1="0"
                          x2="0"
                          y2="1"
                        >
                          <stop
                            offset="5%"
                            stopColor="#6366f1"
                            stopOpacity={0.1}
                          />
                          <stop
                            offset="95%"
                            stopColor="#6366f1"
                            stopOpacity={0}
                          />
                        </linearGradient>
                      </defs>
                      <CartesianGrid
                        strokeDasharray="3 3"
                        vertical={false}
                        stroke="#f1f5f9"
                      />
                      <XAxis
                        dataKey="name"
                        tick={{ fill: "#94a3b8", fontSize: 12 }}
                        axisLine={false}
                        tickLine={false}
                        dy={10}
                      />
                      <YAxis
                        tickFormatter={(value) => `${value / 1000}k`}
                        tick={{ fill: "#94a3b8", fontSize: 12 }}
                        axisLine={false}
                        tickLine={false}
                      />
                      <Tooltip
                        contentStyle={{
                          borderRadius: "8px",
                          border: "none",
                          boxShadow: "0 4px 6px -1px rgb(0 0 0 / 0.1)",
                        }}
                        formatter={(value) => [formatNumber(value), "UV"]}
                      />
                      <Area
                        type="monotone"
                        dataKey="uv"
                        stroke="#6366f1"
                        strokeWidth={3}
                        fillOpacity={1}
                        fill="url(#colorUv)"
                      />
                    </AreaChart>
                  </ResponsiveContainer>
                </div>
              </div>

              {/* Device Pie */}
              <div className="bg-white p-6 rounded-lg shadow-sm border border-slate-200 lg:col-span-1">
                <h3 className="text-sm font-bold text-slate-800 mb-6 uppercase tracking-wide">
                  디바이스 점유율
                </h3>
                <div className="relative h-64 flex justify-center items-center">
                  <ResponsiveContainer width="100%" height="100%">
                    <PieChart>
                      <Pie
                        data={device}
                        innerRadius={60}
                        outerRadius={80}
                        paddingAngle={2}
                        dataKey="value"
                        startAngle={90}
                        endAngle={-270}
                      >
                        <Cell fill="#f97316" />
                        <Cell fill="#334155" />
                      </Pie>
                    </PieChart>
                  </ResponsiveContainer>
                  <div className="absolute inset-0 flex flex-col justify-center items-center pointer-events-none">
                    <span className="text-3xl font-bold text-slate-800">
                      {summary.mobileShare}%
                    </span>
                    <span className="text-xs font-medium text-slate-400">
                      Mobile
                    </span>
                  </div>
                </div>
                <div className="flex justify-center gap-4 mt-2 text-xs">
                  <div className="flex items-center gap-1">
                    <div className="w-2 h-2 rounded-full bg-orange-500"></div>
                    <span className="text-slate-600">Mobile</span>
                  </div>
                  <div className="flex items-center gap-1">
                    <div className="w-2 h-2 rounded-full bg-slate-700"></div>
                    <span className="text-slate-600">PC</span>
                  </div>
                </div>
              </div>

              {/* Channel Pie */}
              <div className="bg-white p-6 rounded-lg shadow-sm border border-slate-200 lg:col-span-1">
                <h3 className="text-sm font-bold text-slate-800 mb-6 uppercase tracking-wide">
                  채널 유형 점유율 (TOP 20)
                </h3>
                <div className="relative h-64 flex justify-center items-center">
                  <ResponsiveContainer width="100%" height="100%">
                    <PieChart>
                      <Pie
                        data={channelTypeData}
                        innerRadius={60}
                        outerRadius={80}
                        paddingAngle={2}
                        dataKey="value"
                        startAngle={90}
                        endAngle={-270}
                      >
                        {channelTypeData.map((entry, index) => (
                          <Cell
                            key={`cell-${index}`}
                            fill={
                              entry.name === "브랜드몰" ? "#6366f1" : "#10b981"
                            }
                          />
                        ))}
                      </Pie>
                    </PieChart>
                  </ResponsiveContainer>
                  <div className="absolute inset-0 flex flex-col justify-center items-center pointer-events-none">
                    <span className="text-2xl font-bold text-slate-800">
                      {channelTypeData.length > 0
                        ? Math.round(
                            (channelTypeData[0].value /
                              channelTypeData.reduce(
                                (a, b) => a + b.value,
                                0
                              )) *
                              100
                          )
                        : 0}
                      %
                    </span>
                    <span className="text-xs font-medium text-slate-400">
                      {channelTypeData[0]?.name}
                    </span>
                  </div>
                </div>
                <div className="flex justify-center gap-4 mt-2 text-xs">
                  <div className="flex items-center gap-1">
                    <div className="w-2 h-2 rounded-full bg-indigo-500"></div>
                    <span className="text-slate-600">브랜드몰</span>
                  </div>
                  <div className="flex items-center gap-1">
                    <div className="w-2 h-2 rounded-full bg-emerald-500"></div>
                    <span className="text-slate-600">제휴채널</span>
                  </div>
                </div>
              </div>
            </div>

            {/* Top 20 Table */}
            <div className="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden mb-6">
              <div className="p-6 border-b border-slate-100 flex justify-between items-center">
                <div className="flex flex-col">
                  <h3 className="text-lg font-bold text-slate-800">
                    코브랜드 도메인 UV TOP 20
                  </h3>
                  <p className="text-xs text-slate-500 mt-1">
                    * 비중(%)은 TOP 20 합계 ({formatNumber(top20SumUV)}) 대비
                    비율입니다.
                  </p>
                </div>
                <span className="text-xs text-slate-500 font-medium bg-slate-100 px-3 py-1 rounded-full">
                  Top 20 UV: {formatNumber(top20SumUV)}
                </span>
              </div>
              <div className="overflow-x-auto max-h-96">
                <table className="w-full text-sm text-left">
                  <thead className="bg-slate-50 text-slate-500 font-semibold uppercase tracking-wider sticky top-0">
                    <tr>
                      <th className="px-6 py-3 text-center w-24 whitespace-nowrap">
                        순위
                      </th>
                      <th className="px-6 py-3">제휴사명</th>
                      <th className="px-6 py-3 text-center">채널유형</th>
                      <th className="px-6 py-3 text-right">UV</th>
                      <th className="px-6 py-3 text-right">비중(%)</th>
                      <th className="px-6 py-3 text-right">증감율</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {coBrandTop20.map((item) => (
                      <tr
                        key={item.rank}
                        className="hover:bg-slate-50 transition-colors"
                      >
                        <td className="px-6 py-3 text-center font-bold text-slate-600">
                          {item.rank}
                        </td>
                        <td className="px-6 py-3 font-medium text-slate-800">
                          {item.name}
                        </td>
                        <td className="px-6 py-3 text-center">
                          <span
                            className={`px-2 py-1 rounded-full text-xs font-medium ${
                              item.type === "브랜드몰"
                                ? "bg-indigo-50 text-indigo-600"
                                : "bg-green-50 text-green-600"
                            }`}
                          >
                            {item.type}
                          </span>
                        </td>
                        <td className="px-6 py-3 text-right text-slate-700 font-mono">
                          {formatNumber(item.uv)}
                        </td>
                        <td className="px-6 py-3 text-right text-slate-500">
                          {((item.uv / top20SumUV) * 100).toFixed(2)}%
                        </td>
                        <td className="px-6 py-3 text-right font-medium">
                          {item.growth === "new" ? (
                            <span className="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-600">
                              신규진입
                            </span>
                          ) : (
                            <span
                              className={
                                item.growth > 0
                                  ? "text-red-500"
                                  : item.growth < 0
                                  ? "text-blue-500"
                                  : "text-slate-500"
                              }
                            >
                              {item.growth > 0 ? "▲" : "▼"}{" "}
                              {Math.abs(item.growth)}%
                            </span>
                          )}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>

            {/* Detailed Top 10s */}
            {detailedTop10 && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                <Top10Table
                  title="브랜드몰 TOP 10"
                  dataInfo={detailedTop10.brandMall}
                  headerColor="indigo"
                />
                <Top10Table
                  title="제휴사 TOP 10"
                  dataInfo={detailedTop10.affiliate}
                  headerColor="emerald"
                />
                <Top10Table
                  title="공식인증예약센터 TOP 10"
                  dataInfo={detailedTop10.officialCenter}
                  headerColor="rose"
                />
              </div>
            )}

            {/* Categories */}
            <div className="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">
              <div className="p-6 border-b border-slate-100 flex justify-between items-center">
                <h3 className="text-lg font-bold text-slate-800">
                  카테고리별 상세 실적
                </h3>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-sm text-left">
                  <thead className="bg-slate-50 text-slate-500 font-semibold uppercase tracking-wider">
                    <tr>
                      <th className="px-6 py-4 text-center whitespace-nowrap">
                        구분
                      </th>
                      <th className="px-6 py-4 text-center whitespace-nowrap">
                        상세 구분
                      </th>
                      <th className="px-6 py-4 text-center whitespace-nowrap">
                        이번주 UV
                      </th>
                      <th className="px-6 py-4 text-center whitespace-nowrap">
                        지난주 UV
                      </th>
                      <th className="px-6 py-4 text-center whitespace-nowrap">
                        변동률
                      </th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {categories.map((group, groupIdx) => (
                      <React.Fragment key={groupIdx}>
                        <tr className="bg-slate-50">
                          <td
                            colSpan={5}
                            className="px-6 py-2 font-bold text-slate-700 border-t border-b border-slate-200 text-sm"
                          >
                            {group.group}
                          </td>
                        </tr>
                        {group.items.map((row, idx) => (
                          <tr
                            key={`${groupIdx}-${idx}`}
                            className="hover:bg-slate-50 transition-colors"
                          >
                            <td className="px-6 py-3 font-medium text-slate-500 text-center whitespace-nowrap hidden md:table-cell">
                              {group.group.split(" ")[0]}
                            </td>
                            <td className="px-6 py-3 font-medium text-slate-700 text-center whitespace-nowrap">
                              {row.name}
                            </td>
                            <td className="px-6 py-3 text-right font-medium text-slate-900 whitespace-nowrap">
                              {formatNumber(row.current)}
                            </td>
                            <td className="px-6 py-3 text-right text-slate-400 whitespace-nowrap">
                              {formatNumber(row.prev)}
                            </td>
                            <td className="px-6 py-3 text-right whitespace-nowrap">
                              <span
                                className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold ${
                                  row.rate > 0
                                    ? "bg-red-50 text-red-600"
                                    : "bg-blue-50 text-blue-600"
                                }`}
                              >
                                {row.rate > 0 ? "▲" : "▼"} {Math.abs(row.rate)}%
                              </span>
                            </td>
                          </tr>
                        ))}
                      </React.Fragment>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<Dashboard data={dashboardData} />);
    </script>
  </body>
</html>
