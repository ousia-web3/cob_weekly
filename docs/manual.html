<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Co-Brand Weekly Report Generator - User Manual</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #5865F2;
            --secondary-color: #FF5722;
        }
        body {
            font-family: 'Google Sans', 'Noto Sans KR', sans-serif;
            background-color: #f8f9fa;
            overflow: hidden;
            color: #3c4043;
        }
        .glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .nav-item.active {
            background-color: #e8f0fe;
            color: #1967d2;
            border-right: 4px solid #1967d2;
        }
        .card-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        #canvas-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .content-panel {
            z-index: 10;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            height: 100%;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: #dadce0;
            border-radius: 10px;
        }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        code {
            background-color: #f1f3f4;
            padding: 2px 4px;
            border-radius: 4px;
            font-family: monospace;
            color: #d93025;
        }
        pre {
            background-color: #202124;
            color: #e8eaed;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin: 1rem 0;
        }
        pre code {
            background-color: transparent;
            color: inherit;
            padding: 0;
        }
    </style>
</head>
<body class="flex h-screen">

    <div id="canvas-container"></div>

    <!-- Sidebar Navigation -->
    <nav class="w-80 glass h-full flex flex-col border-r border-gray-200 z-20 shadow-xl">
        <div class="p-6">
            <div class="flex items-center gap-2 mb-2">
                <!-- Icon -->
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-white font-bold text-lg">C</div>
                <h1 class="text-xl font-bold text-gray-800 tracking-tight">Co-Brand Report</h1>
            </div>
            <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">User Manual & Guide</p>
        </div>

        <div id="sidebar-nav" class="flex-1 overflow-y-auto px-3 py-2 space-y-1">
            <!-- Navigation Items -->
        </div>

        <div class="p-4 border-t border-gray-100">
            <div class="bg-blue-50 p-4 rounded-xl">
                <p class="text-[11px] text-blue-700 leading-snug font-medium">
                    "데이터 분석부터 리포트 발송까지,<br>원클릭으로 해결하세요."

        </div>
    </nav>

    <!-- Main Content Area -->

            <div class="flex items-center gap-4">

            </div>
            <div class="flex items-center gap-4">
                <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Version 1.0</span>
            </div>
        </header>

        <div id="main-content" class="flex-1 relative">

    </main>

        function updateSidebar() {
            const nav = document.getElementById('sidebar-nav');
            const items = [
                { id: 'intro', label: '1. 프로젝트 개요' },
                { id: 'setup', label: '2. 시스템 요구사항 및 설치' },
                { id: 'execution', label: '3. 실행 가이드' },
                { id: 'usage', label: '4. 사용 방법' },
                { id: 'structure', label: '5. 프로젝트 구조' },
                { id: 'trouble', label: '6. 트러블슈팅' }
            ];

            nav.innerHTML = items.map(item => `
                <button onclick="navigate('${item.id}')" class="nav-item ${currentView===item.id?'active':''} w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-all hover:bg-gray-100 text-left">
                    <span>${item.label}</span>
                </button>
            `).join('');
        }

        function updateContent() {
            const container = document.getElementById('main-content');
            const data = CONTENT[currentView];
            
            let html = `<div class="content-panel fade-in p-10 max-w-5xl mx-auto">`;
            
            // Header
            html += `
                <div class="mb-10">
                    <span class="text-blue-600 font-bold tracking-widest uppercase text-xs mb-2 block">${data.subtitle}</span>
                    <h2 class="text-4xl font-bold text-gray-900 mb-4">${data.title}</h2>
                    ${data.desc ? `<p class="text-lg text-gray-600 leading-relaxed">${data.desc}</p>` : ''}
                </div>
            `;

            // Dynamic Content Generation
            if (currentView === 'intro') {
                html += `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">`;
                data.cards.forEach(card => {
                    html += `
                        <div class="glass p-6 rounded-2xl card-shadow border-t-4 border-blue-500 hover:-translate-y-1 transition-transform duration-300">
                            <h3 class="font-bold text-gray-800 mb-3 text-lg">${card.title}</h3>
                            <p class="text-sm text-gray-600 leading-relaxed">${card.desc}</p>
                        </div>
                    `;
                });
                html += `</div>`;
            } 
            else if (currentView === 'setup') {
                // Requirements
                html += `
                    <div class="bg-yellow-50 p-6 rounded-2xl border border-yellow-100 mb-8">
                        <h3 class="font-bold text-yellow-800 mb-4 flex items-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            필수 요구사항
                        </h3>
                        <ul class="list-disc list-inside space-y-2 text-sm text-yellow-900">
                            ${data.requirements.map(req => `<li>${req}</li>`).join('')}
                        </ul>
                    </div>
                `;

                html += `<div class="space-y-8">`;
                data.steps.forEach(step => {
                    html += `
                        <div class="group">
                            <h3 class="font-bold text-gray-800 mb-3 text-lg border-l-4 border-blue-500 pl-3">${step.title}</h3>
                            <p class="text-gray-600 mb-3 text-sm">${step.desc}</p>
                            <div class="relative">
                                <pre class="text-sm"><code>${step.cmd}</code></pre>
                                <button onclick="copyToClipboard('${step.cmd.replace(/\n/g, '\\n').replace(/'/g, "\\'")}', this)" class="absolute top-2 right-2 p-2 bg-white/10 hover:bg-white/20 rounded-lg transition-colors text-gray-400 hover:text-white" title="Copy">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                                </button>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }
            else if (currentView === 'execution') {
                data.methods.forEach(method => {
                    html += `<div class="mb-10">`;
                    html += `<h3 class="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2">${method.title}</h3>`;
                    
                    if (method.type === 'easy') {
                        html += `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">`;
                        method.items.forEach(item => {
                            html += `
                                <div class="bg-white p-5 rounded-xl border border-gray-200 hover:border-blue-400 transition-colors shadow-sm">

                        method.steps.forEach(step => {

                                    <span class="text-sm font-bold text-gray-500 mb-2 block">${step.label}</span>

                                    </div>

                            `;
                        });
                        html += `</div>`;
                    }
                    html += `</div>`;
                });
            }
            else if (currentView === 'usage') {
                html += `<div class="space-y-4">`;
                data.steps.forEach(step => {
                    html += `
                        <div class="flex gap-6 items-start bg-white/60 p-6 rounded-2xl hover:bg-white transition-all shadow-sm hover:shadow-md">
                            <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-lg flex-shrink-0">${step.num}</div>
                            <div>
                                <h3 class="font-bold text-gray-800 mb-2 text-lg">${step.title}</h3>
                                <p class="text-gray-600 leading-relaxed">${step.desc}</p>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }
            else if (currentView === 'structure') {
                html += `
                    <div class="bg-[#202124] rounded-2xl p-6 shadow-2xl overflow-hidden">
                        <pre class="text-sm text-gray-300 font-mono leading-relaxed" style="background: transparent; margin: 0; padding: 0;">${data.tree}</pre>
                    </div>
                `;
            }
            else if (currentView === 'trouble') {
                html += `<div class="grid grid-cols-1 gap-6">`;
                data.qna.forEach(item => {
                    html += `
                        <div class="glass p-6 rounded-2xl card-shadow border-l-4 border-red-400">
                            <h3 class="font-bold text-gray-800 mb-3 flex items-start gap-3">
                                <span class="text-xs bg-red-100 text-red-600 px-2 py-1 rounded font-bold mt-0.5">Q</span> 
                                <span class="leading-relaxed">${item.q}</span>
                            </h3>
                            <div class="pl-10">
                                <p class="text-gray-600 leading-relaxed text-sm bg-gray-50 p-3 rounded-lg">${item.a}</p>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            html += `</div>`; // End content-panel
            container.innerHTML = html;
        }

        function navigate(view) {
            currentView = view;
            updateSidebar();
            updateContent();
            document.getElementById('breadcrumb').innerText = `Manual / ${CONTENT[view].title}`;
            update3DScene(view);
        }

        // --- 3D Background ---
        let scene, camera, renderer, crystal, particles;
        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0x4285f4, 0.8);
            dirLight.position.set(10, 10, 10);
            scene.add(dirLight);

            // Objects
            const geometry = new THREE.IcosahedronGeometry(3, 0);
            const material = new THREE.MeshPhongMaterial({ 
                color: 0x5865F2, 
                wireframe: true, 
                transparent: true, 
                opacity: 0.15 
            });
            crystal = new THREE.Mesh(geometry, material);
            scene.add(crystal);

            // Particles
            const particlesGeom = new THREE.BufferGeometry();
            const pos = [];
            for(let i=0; i<300; i++) {
                pos.push((Math.random()-0.5)*40, (Math.random()-0.5)*40, (Math.random()-0.5)*40);
            }
            particlesGeom.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
            particles = new THREE.Points(particlesGeom, new THREE.PointsMaterial({ color: 0xa0a0a0, size: 0.05 }));
            scene.add(particles);

            camera.position.z = 12;
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if(crystal) {
                crystal.rotation.y += 0.002;
                crystal.rotation.x += 0.001;
            }
            if(particles) {
                particles.rotation.y -= 0.0005;
            }
            renderer.render(scene, camera);
        }

        function update3DScene(view) {
            if (!crystal) return;
            
            // Simple camera movements based on view
            const targets = {
                intro: { z: 12, rotZ: 0 },
                setup: { z: 14, rotZ: 0.5 },
                execution: { z: 10, rotZ: 1 },
                usage: { z: 15, rotZ: 1.5 },
                structure: { z: 12, rotZ: 2 },
                trouble: { z: 13, rotZ: 2.5 }
            };

            const t = targets[view] || targets.intro;
            gsap.to(camera.position, { duration: 1.5, z: t.z });
            gsap.to(crystal.rotation, { duration: 1.5, z: t.rotZ });
        }

        function copyToClipboard(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                const originalHTML = btn.innerHTML;
                btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                }, 2000);
            });
        }

        window.onload = () => {
            init3D();
            navigate('intro');
        };

        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>
</html>
